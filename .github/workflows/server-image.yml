# Builds the image for my server (amd64) and ARM machines, and pushes it
# to ghcr.io/<owner>/sure as :main and :sha-<commit>. Upstream's publish.yml
# keeps Sure's release channels and stays off in this fork.
name: Server image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'charts/**'
      - 'mobile/**'
      - '**.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

env:
  # Registry names must be lower case; the owner here isn't.
  IMAGE: ghcr.io/abhash-chakraborty/sure

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Embed the version
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest upstream release this build includes, so the app shows v2026.11.3-alpha
        # instead of 0.0.0-dev.<full commit>. The short commit is shown beside it.
        run: |
          tag=$(gh api repos/we-promise/sure/releases --jq '[.[] | select(.draft | not)][0].tag_name')
          test -n "$tag"
          printf '%s\n' "${tag#v}" > .sure-version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.platform }}"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/${{ matrix.platform }}
          retention-days: 1

  merge:
    name: Tag the image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest
        run: |
          image="$IMAGE"
          docker buildx imagetools create \
            -t "$image:main" -t "$image:sha-${GITHUB_SHA::7}" \
            "$image@$(cat /tmp/digests/amd64)" "$image@$(cat /tmp/digests/arm64)"
          docker buildx imagetools inspect "$image:main"
